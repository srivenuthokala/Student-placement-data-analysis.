services:
  - type: web
    name: student-placement-analysis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DB_ENGINE
        value: sqlite
      - key: PYTHON_VERSION
        value: 3.11.9
